<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Vehicle Document Alert</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/screenshot-import-test.js"></script>
    <script>
      (function () {
        const STORAGE_KEY = 'vehicle_document_expiry_app_supabase_v1';
        function readVehicles() {
          try {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            return Array.isArray(data) ? data : [];
          } catch (e) {
            return [];
          }
        }
        function formatDate(value) {
          if (!value) return 'Date missing';
          try {
            return new Date(value).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
          } catch (e) {
            return value;
          }
        }
        function daysLeft(value) {
          if (!value) return null;
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const expiry = new Date(value);
          expiry.setHours(0, 0, 0, 0);
          return Math.ceil((expiry - today) / 86400000);
        }
        function statusText(value) {
          const days = daysLeft(value);
          if (days === null) return 'Date missing';
          if (days < 0) return 'Failed ' + Math.abs(days) + ' days ago';
          if (days === 0) return 'Failed today';
          if (days <= 30) return days + ' days left';
          return 'Valid - ' + days + ' days left';
        }
        function esc(text) {
          return String(text || '').replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }
        function exportPdfReport() {
          const vehicles = readVehicles();
          const now = new Date().toLocaleString('en-IN');
          const rows = vehicles.map(function (vehicle, vehicleIndex) {
            const docs = Array.isArray(vehicle.docs) ? vehicle.docs : [];
            const docRows = docs.map(function (doc) {
              return '<tr><td>' + esc(doc.name || 'Document') + '</td><td>' + esc(formatDate(doc.expiryDate)) + '</td><td>' + esc(statusText(doc.expiryDate)) + '</td></tr>';
            }).join('') || '<tr><td colspan="3">No document added</td></tr>';
            return '<section class="vehicle-card"><h2>' + (vehicleIndex + 1) + '. ' + esc(vehicle.vehicleNo || 'Vehicle No Missing') + '</h2><p><b>Vehicle Model:</b> ' + esc(vehicle.model || 'Not added') + '</p><p><b>Owner / Driver:</b> ' + esc(vehicle.owner || 'Not added') + '</p><p><b>WhatsApp Mobile:</b> ' + esc(vehicle.mobile || 'Not added') + '</p><p><b>Last Vehicle Service:</b> ' + esc(formatDate(vehicle.lastService)) + '</p><p><b>Next Service:</b> ' + esc(formatDate(vehicle.nextService)) + '</p><p><b>Next Service Km:</b> ' + esc(vehicle.nextServiceKm || 'Not added') + '</p><table><thead><tr><th>Document</th><th>Expiry Date</th><th>Status</th></tr></thead><tbody>' + docRows + '</tbody></table></section>';
          }).join('') || '<p>No vehicle data available.</p>';
          const win = window.open('', '_blank');
          if (!win) {
            alert('Popup blocked. Browser popup allow karo, phir PDF Report dabao.');
            return;
          }
          win.document.write('<!doctype html><html><head><title>Vehicle Document Report</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#111827}h1{margin:0;color:#1d4ed8}.top{border-bottom:3px solid #2563eb;padding-bottom:12px;margin-bottom:16px}.summary{display:flex;gap:10px;margin:14px 0}.box{border:1px solid #d1d5db;border-radius:10px;padding:10px;min-width:120px}.vehicle-card{page-break-inside:avoid;border:1px solid #dbeafe;border-radius:14px;padding:14px;margin:14px 0}h2{margin:0 0 8px;color:#0f172a}p{margin:5px 0}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left;font-size:13px}th{background:#eff6ff}.footer{margin-top:24px;text-align:center;color:#475569;font-weight:bold}@media print{button{display:none}body{margin:10mm}}</style></head><body><div class="top"><h1>Vehicle Document Report</h1><p>Generated: ' + esc(now) + '</p><p><b>Total Vehicles:</b> ' + vehicles.length + '</p></div><button onclick="window.print()" style="background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:bold">Save / Print PDF</button>' + rows + '<div class="footer">Thank You<br/>Sanjay Vehicle Management System</div></body></html>');
          win.document.close();
          setTimeout(function () { win.print(); }, 500);
        }
        function addButton() {
          if (document.getElementById('pdfReportBtn')) return;
          const hero = document.querySelector('.hero > div');
          if (!hero) return;
          const button = document.createElement('button');
          button.id = 'pdfReportBtn';
          button.textContent = 'PDF Report';
          button.onclick = exportPdfReport;
          button.style.cssText = 'margin-left:8px;background:#0f172a;color:white;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer';
          const syncBtn = hero.querySelector('.syncBtn');
          if (syncBtn) syncBtn.insertAdjacentElement('afterend', button); else hero.appendChild(button);
        }
        const timer = setInterval(addButton, 700);
        setTimeout(function () { clearInterval(timer); addButton(); }, 10000);
        window.exportVehiclePdfReport = exportPdfReport;
      })();
    </script>
  </body>
</html>
